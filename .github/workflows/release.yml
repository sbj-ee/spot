name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets are present
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KS_B64 KS_PW K_ALIAS K_PW; do
            if [ -z "${!v}" ]; then echo "::error::missing signing secret ($v)"; missing=1; fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      - name: Build APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify signature (prints cert SHA-256 only)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify "$APK"
          FP=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$FP" ]; then echo "::error::could not read signer fingerprint"; exit 1; fi
          echo "Signer cert SHA-256: $FP"
          echo "SIGNER_SHA256=$FP" >> "$GITHUB_ENV"

      - name: Stage artifacts
        run: |
          VER=$(sed -n 's/^version: *//p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/spot-$VER.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/spot-$VER.aab"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: spot-release
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Signer cert SHA-256: ${SIGNER_SHA256}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES"
          fi
