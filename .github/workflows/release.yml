name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets are present
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KS_B64 KS_PW K_ALIAS K_PW; do
            if [ -z "${!v}" ]; then echo "::error::missing signing secret ($v)"; missing=1; fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      - name: Build APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify signature (prints cert SHA-256 only)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify "$APK"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -i 'digest' || true
          FP=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -i 'certificate SHA-256 digest' | head -1 | sed -E 's/.*digest: *//' | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if [ -z "$FP" ]; then echo "::error::could not read signer fingerprint"; exit 1; fi
          EXPECTED=ddc25321eff3ea41d3341d3a4d9c7137599c717517f35d9a9c22d6a643f7ceb2
          if [ "$FP" != "$EXPECTED" ]; then echo "::error::signer $FP != expected $EXPECTED"; exit 1; fi
          echo "Signer cert SHA-256: $FP"
          echo "SIGNER_SHA256=$FP" >> "$GITHUB_ENV"

      - name: Stage artifacts
        run: |
          VER=$(sed -n 's/^version: *//p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/spot-$VER.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/spot-$VER.aab"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Sign SHA256SUMS (minisign)
        env:
          # minisign secret key (the whole minisign.key file) and its password,
          # the same release key as zwriter/zedit. The in-app updater refuses
          # releases without a valid SHA256SUMS.minisig.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::missing signing secret (MINISIGN_SECRET_KEY)"; exit 1
          fi
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s "$key" -m dist/SHA256SUMS -t "spot ${GITHUB_REF_NAME} SHA256SUMS"
          rm -f "$key"
          # Must verify with the public key compiled into this commit.
          pub=$(sed -n "s/^ *'\(RW[A-Za-z0-9+/=]*\)';/\1/p" lib/update/minisign.dart)
          test -n "$pub"
          minisign -V -P "$pub" -m dist/SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: spot-release
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Signer cert SHA-256: ${SIGNER_SHA256}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES"
          fi
